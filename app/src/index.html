<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tree Factory — 收音探針 (SPIKE-002)</title>
<style>
  :root{--bg:#0B0F14;--s:#131A22;--s2:#1B242E;--bd:#28323D;--tx:#E8EEF5;--dim:#94A3B3;
        --ac:#4DA3FF;--ok:#35C68A;--warn:#F5A623;--err:#FF6B6B;--rec:#FF4D4D}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
       padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
  h1{font-size:17px;margin:0 0 2px}
  h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px}
  .sub{color:var(--dim);font-size:12px;margin:0 0 4px}
  .card{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px}
  .row b{color:var(--dim);font-weight:500;flex:0 0 auto}
  .row span{text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}
  .ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  button{flex:1 1 auto;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);
         background:var(--s2);color:var(--tx);font:600 14px/1 inherit}
  button.pri{background:var(--ac);border-color:var(--ac);color:#08121E}
  button.dng{background:#3A1A1A;border-color:var(--rec);color:#FFD9D9}
  button:disabled{opacity:.45}
  meter{display:block;width:100%;height:12px;border-radius:6px;background:var(--s2);overflow:hidden;border:1px solid var(--bd)}
  .lv{height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--warn) 70%,var(--rec));transition:width .06s linear}
  pre{background:#070B10;border:1px solid var(--bd);border-radius:8px;padding:9px;margin:0;
      font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-all;
      max-height:230px;overflow:auto}
  .big{font:600 26px/1.2 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px;vertical-align:1px}
  .dot.on{background:var(--rec);animation:p 1.1s infinite}
  @keyframes p{50%{opacity:.25}}
  .tag{display:inline-block;border:1px solid var(--bd);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<h1>收音探針</h1>
<p class="sub">SPIKE-002 · Tauri 2 iOS webview 的 <code>getUserMedia</code> 與背景 / 鎖屏行為</p>

<h2>環境</h2>
<div class="card" id="env"></div>

<h2>能力偵測</h2>
<div class="card" id="cap"></div>

<h2>收音</h2>
<div class="card">
  <div class="row"><b>狀態</b><span id="state"><i class="dot"></i>待機</span></div>
  <div class="row"><b>錄音長度</b><span class="big" id="sec">0.0s</span></div>
  <div class="row" style="padding-top:6px"><b>音量</b><span id="lv-txt">0.000</span></div>
  <div style="height:12px;border-radius:6px;background:var(--s2);border:1px solid var(--bd);overflow:hidden;margin:2px 0 8px">
    <div class="lv" id="lv"></div>
  </div>
  <div class="btns">
    <button class="pri" id="start" onclick="start()">開始收音</button>
    <button id="stop" onclick="stop()" disabled>停止</button>
  </div>
  <div class="btns">
    <button id="play" onclick="play()" disabled>播放</button>
    <button id="send" onclick="send()" disabled>送出結果</button>
  </div>
  <div class="row"><b>軌道設定</b><span id="trk">—</span></div>
  <div class="row"><b>錄音大小</b><span id="sz">—</span></div>
</div>

<h2>事件紀錄</h2>
<pre id="log">（尚無事件）</pre>

<button class="pri" style="width:100%;margin-top:10px" onclick="send()">把完整報告送到電腦（spike collector）</button>

<script>
const LOG=[], T0=Date.now();
const $=id=>document.getElementById(id);
function log(m){ LOG.push(new Date().toISOString().slice(11,23)+"  "+m);
  $('log').textContent = LOG.slice(-40).join("\n"); }
function rows(el,obj){ el.innerHTML = Object.entries(obj).map(([k,v])=>{
  const cls = /✗|fail|unsupported|denied|error/i.test(String(v)) ? 'err'
            : /✓|yes|granted|supported/i.test(String(v)) ? 'ok' : '';
  return '<div class="row"><b>'+k+'</b><span class="'+cls+'">'+String(v)+'</span></div>'; }).join(''); }

/* ---------- 環境 ---------- */
const isFile = location.protocol === 'file:';
const ENV = {
  'UA': navigator.userAgent,
  'protocol': location.protocol,
  'origin': location.origin,
  'isSecureContext': String(window.isSecureContext) + (window.isSecureContext?' ✓':' ✗'),
  'innerSize': innerWidth+'x'+innerHeight,
  'dpr': devicePixelRatio,
  'locale': navigator.language,
  'standalone?': String(navigator.standalone),
};
rows($('env'), ENV); log('boot protocol='+location.protocol+' secure='+window.isSecureContext);

/* ---------- 能力偵測 ---------- */
const md = navigator.mediaDevices || {};
const MR = window.MediaRecorder;
const MIMES = ['audio/webm','audio/webm;codecs=opus','audio/mp4','audio/mp4;codecs=mp4a.40.2',
               'audio/wav','audio/ogg','audio/ogg;codecs=opus','audio/aac'];
const mimeOK = {};
if (MR && MR.isTypeSupported) MIMES.forEach(m=>{ mimeOK[m] = MR.isTypeSupported(m)?'✓':'-'; });
const CAP = {
  'mediaDevices': md ? '✓' : '✗ 不存在',
  'getUserMedia': typeof md.getUserMedia === 'function' ? '✓' : '✗',
  'getDisplayMedia': typeof md.getDisplayMedia === 'function' ? '✓' : '✗',
  'enumerateDevices': typeof md.enumerateDevices === 'function' ? '✓' : '✗',
  'MediaRecorder': MR ? '✓' : '✗',
  'AudioContext': (window.AudioContext||window.webkitAudioContext) ? '✓' : '✗',
  'AudioWorklet': (window.AudioWorkletNode) ? '✓' : '✗',
  'navigator.permissions': navigator.permissions ? '✓' : '✗',
  'navigator.wakeLock': navigator.wakeLock ? '✓' : '✗ (iOS Safari 未支援)',
  'Notification': ('Notification' in window) ? '✓' : '✗',
  'Worker': window.Worker ? '✓' : '✗',
  'SharedWorker': window.SharedWorker ? '✓' : '✗',
  'WebSocket': window.WebSocket ? '✓' : '✗',
  'MediaRecorder mimes': MIMES.map(m=>m.split(';')[0]+mimeOK[m]).join(' '),
};
rows($('cap'), CAP);

/* ---------- 收音 ---------- */
let stream=null, rec=null, chunks=[], ac=null, an=null, buf=null, tmr=null, t0=0, blob=null, maxLv=0;
let acT0=null, capturedSec=null, beats=0, hb=null, finished=false;
/* 心跳：每秒 +1。背景/鎖屏時 JS 若被暫停，這個計數器就不會動 → 用來判定是否被暫停。 */
function startHeartbeat(){
  beats=0; hb=setInterval(()=>{ beats++;
    if(beats%5===0) log('♥ 心跳 '+beats+' ｜ ac.currentTime='+ac.currentTime.toFixed(2)+'s ｜ 捕獲秒數='+(ac.currentTime-acT0).toFixed(2)+'s');
  },1000);
}
async function start(){
  $('start').disabled=true; $('stop').disabled=false; log('getUserMedia 請求…');
  const cons={ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } };
  try{
    stream = await md.getUserMedia(cons);
  }catch(e1){
    log('✗ 關閉 3A 失敗：'+e1.name+' / '+e1.message+' → 改用預設約束重試');
    try{ stream = await md.getUserMedia({audio:true}); }
    catch(e2){ log('✗ 預設約束也失敗：'+e2.name+' / '+e2.message);
      $('state').innerHTML='<i class="dot"></i>權限或裝置失敗'; $('start').disabled=false; $('stop').disabled=true; return; }
  }
  const t=stream.getAudioTracks()[0], s=t.getSettings();
  log('✓ 取到音軌 label="'+(t.label||'(空)')+'"');
  $('trk').textContent = ['sampleRate='+s.sampleRate,'ch='+s.channelCount,'echo='+s.echoCancellation,
    'ns='+s.noiseSuppression,'agc='+s.autoGainControl,'deviceId='+(s.deviceId?'(有)':'(空)')].join(' ');
  const devs=(await md.enumerateDevices()).filter(d=>d.kind==='audioinput');
  log('audioinput 裝置數='+devs.length+' → '+devs.map(d=>d.label||'(空label)').join(' | '));
  if(devs.length) $('trk').textContent += ' ｜ 裝置：'+(devs[0].label||'(空)');

  ac = new (window.AudioContext||window.webkitAudioContext)();
  await ac.resume().catch(()=>{});
  log('AudioContext state='+ac.state+' sampleRate='+ac.sampleRate);
  const src=ac.createMediaStreamSource(stream);
  an=ac.createAnalyser(); an.fftSize=2048; an.smoothingTimeConstant=.6;
  src.connect(an); buf=new Float32Array(an.fftSize);

  const mime = MIMES.find(m=>MR.isTypeSupported && MR.isTypeSupported(m)) || '';
  rec = new MR(stream, mime?{mimeType:mime}:undefined);
  log('MediaRecorder mimeType='+rec.mimeType);
  chunks=[]; rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  rec.onerror=e=>log('✗ recorder error: '+(e.error&&e.error.name));
  rec.start(1000);

  t0=Date.now(); maxLv=0; acT0=ac.currentTime; capturedSec=null;
  tmr=setInterval(()=>{ $('sec').textContent=((Date.now()-t0)/1000).toFixed(1)+'s';
    an.getFloatTimeDomainData(buf);
    let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
    const rms=Math.sqrt(sum/buf.length); if(rms>maxLv) maxLv=rms;
    $('lv').style.width=Math.min(100, rms*400)+'%'; $('lv-txt').textContent=rms.toFixed(4);
  },100);
  $('state').innerHTML='<i class="dot on"></i>收音中';
  log('✓ 收音開始（waveform 每 100ms 取樣）');
  startHeartbeat();
}
function stop(){
  if(tmr){clearInterval(tmr);tmr=null;}
  if(hb){clearInterval(hb);hb=null;}
  /* 用 AudioContext 時鐘量「實際捕獲的音訊秒數」：它與音訊算繪同步，不受 JS 暫停影響。 */
  if(ac && acT0!==null && capturedSec===null) capturedSec=Number((ac.currentTime-acT0).toFixed(2));
  if(rec && rec.state!=='inactive') rec.stop();
  if(stream) stream.getTracks().forEach(t=>t.stop());
  if(ac) ac.close().catch(()=>{});
  /* iOS 的 MediaRecorder 在背景會把 ondataavailable 合併（不會每秒給）→ 不能拿它當存活訊號。
     另外 rec.stop() 的 stop 事件可能延遲 >1s 才來；所以這裡加 fallback，並讓 finish 只跑一次。 */
  const finish=()=>{
    if(finished) return; finished=true;
    const type=(rec&&rec.mimeType)||'audio/webm';
    blob=new Blob(chunks,{type});
    $('sz').textContent = blob.size+' bytes ('+type+')';
    $('sec').textContent = ((Date.now()-t0)/1000).toFixed(1)+'s';
    $('state').innerHTML='<i class="dot"></i>已停止';
    $('stop').disabled=true; $('start').disabled=false; $('play').disabled=false; $('send').disabled=false;
    log('✓ 停止：'+blob.size+' bytes ｜ 峰值音量='+maxLv.toFixed(4)+' ｜ 片段數='+chunks.length+
      ' ｜ 捕獲音訊='+capturedSec+'s ｜ 牆鐘='+((Date.now()-t0)/1000).toFixed(2)+'s ｜ 心跳='+beats);
  };
  if(rec && rec.state!=='inactive'){ rec.onstop=finish; rec.stop(); setTimeout(finish, 1500); }
  else finish();
}
function play(){ if(!blob) return; const a=new Audio(); a.src=URL.createObjectURL(blob);
  a.play().then(()=>log('▶ 播放中')).catch(e=>log('✗ 播放失敗 '+e.name)); }

/* ---------- 上報（給電腦端 collector） ---------- */
function report(){ return { spike:'SPIKE-002', at:new Date().toISOString(),
  env:ENV, cap:CAP, log:LOG, recorder:{ mime:(rec&&rec.mimeType)||null, bytes:blob?blob.size:0,
  peak:maxLv, seconds:Number(((Date.now()-t0)/1000).toFixed(2)), chunks:chunks.length,
  capturedSec, wallSec:Number(((Date.now()-t0)/1000).toFixed(2)), beats, chunkSizes:chunks.map(c=>c.size) } }; }
async function send(){
  const url='http://127.0.0.1:8765/report';
  const body=report();
  try{
    const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    log('✓ 報告已送出 HTTP '+r.status);
  }catch(e){ log('✗ 送報告失敗（collector 沒開？）：'+e.message); }
  if(blob){
    try{
      const r2=await fetch('http://127.0.0.1:8765/audio?mime='+encodeURIComponent(blob.type||'application/octet-stream'),
        {method:'POST',headers:{'content-type':'application/octet-stream'},body:blob});
      log('✓ 音檔已送出 HTTP '+r2.status+'（'+blob.size+' bytes）');
    }catch(e){ log('✗ 送音檔失敗：'+e.message); }
  }
}

/* ---------- 背景 / 鎖屏行為觀測 ---------- */
['visibilitychange','pagehide','pageshow','freeze','resume','blur','focus'].forEach(ev=>{
  addEventListener(ev, e=>log('◆ '+ev+(ev==='visibilitychange'?' → '+document.visibilityState:'')));
});
addEventListener('error', e=>log('✗ JS error: '+e.message));
addEventListener('unhandledrejection', e=>log('✗ unhandled rejection: '+(e.reason&&e.reason.message||e.reason)));
log('事件監聽已掛載（visibilitychange / pagehide / freeze / resume）');
window.__SPIKE__ = report;
window.__SPIKE_JSON = () => JSON.stringify(report());

/* ---------- 自動模式：不必手動點按（信任模式 / 自動化驗證用） ---------- */
/* 啟動後 1 秒自動開始收音 8 秒 → 停止 → 1.5 秒後把報告 + 音檔送回 Mac 的 collector。 */
/* 要在 UI 手動操作時：把下面的 AUTO 改成 false 即可（或改用 freeRun.html）。 */
const AUTO = true;
const AUTO_SEC = 35;   // 背景測試需要夠長的錄音窗
if (AUTO) {
  (async () => {
    await new Promise(r => setTimeout(r, 1000));
    log('◆ 自動模式啟動：錄 ' + AUTO_SEC + ' 秒後自動回傳');
    await start();
    await new Promise(r => setTimeout(r, AUTO_SEC * 1000));
    stop();
    await new Promise(r => setTimeout(r, 2600));   // 等 stop 事件 / fallback 收完最後一塊
    await send();
    log('◆ 自動模式完成');
  })();
}
</script>
</body>
</html>
