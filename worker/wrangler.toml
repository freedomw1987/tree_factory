# TECH-004：會議 Durable Object（一場會議 = 一個 DO 實例）
name = "tree-factory-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# TECH-014：SESSION_ANCHOR_KEY 是簽 HMAC 用的金鑰，**絕不得** commit。
# 走 `wrangler secret put SESSION_ANCHOR_KEY`（正式）或 .dev.vars（本機）—
# `.dev.vars` 在 .gitignore 內，安全。
# 沒設金鑰時 /session/start 會回 500 SESSION_ANCHOR_NOT_CONFIGURED（fail-closed）。

# DO 的 SQLite 儲存後端（`new_sqlite_classes` 需要 compatibility_date >= 2024-04-03）
[[durable_objects.bindings]]
name = "MEETING"
class_name = "MeetingDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MeetingDurableObject"]

[vars]
# 憑證一律走 secret（`wrangler secret put CLOUDFLARE_API_KEY` / `CLOUDFLARE_ACCOUNT_ID`）；
# 這裡只放非機密的模型設定。`HARNESS_PROVIDER = "faux"` 可完全離線跑（測試用）。
HARNESS_PROVIDER = "cloudflare-workers-ai"
REALTIME_MODEL_ID = "@cf/ibm-granite/granite-4.0-h-micro"
NOTES_MODEL_ID = "@cf/google/gemma-4-26b-a4b-it"